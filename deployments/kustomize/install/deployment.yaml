apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-ambulance-webapi
spec:
  replicas: 1
  selector:
    matchLabels:
      pod: ml-ambulance-webapi-label
  template:
    metadata:
      labels:
        pod: ml-ambulance-webapi-label
    spec:
      volumes:
      - name: init-scripts
        configMap:
          name: ml-ambulance-webapi-postgres-init

      initContainers:
      - name: init-postgres
        image: postgres:17
        imagePullPolicy: Always
        command: ["sh", "-c"]
        args:
          - |
            echo "Waiting for Postgres...";
            until pg_isready -h $POSTGRES_HOST -p $POSTGRES_PORT -U $POSTGRES_USER; do
              sleep 2;
            done;

            echo "Running init script...";
            PGPASSWORD=$POSTGRES_PASSWORD psql \
              -h $POSTGRES_HOST \
              -p $POSTGRES_PORT \
              -U $POSTGRES_USER \
              -d $POSTGRES_DB \
              -f /scripts/init-db.sql

        volumeMounts:
          - name: init-scripts
            mountPath: /scripts

        env:
          - name: POSTGRES_HOST
            value: postgres-db

          - name: POSTGRES_PORT
            value: "5432"

          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: ambulance-db-secret
                key: username

          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ambulance-db-secret
                key: password

          - name: POSTGRES_DB
            value: ambulance

        resources:
          requests:
            memory: "128Mi"
            cpu: "0.01"
          limits:
            memory: "256Mi"
            cpu: "0.1"

      containers:
      - name: ml-ambulance-webapi-container
        image: mariia610/ambulance-webapi:latest
        imagePullPolicy: Always
        ports:
        - name: webapi-port
          containerPort: 8080

        env:
          - name: AMBULANCE_API_ENVIRONMENT
            value: production

          - name: AMBULANCE_API_PORT
            value: "8080"

          # IMPORTANT: match Go code (POSTGRES_*)
          - name: POSTGRES_HOST
            value: postgres-db

          - name: POSTGRES_PORT
            value: "5432"

          - name: POSTGRES_USER
            valueFrom:
              secretKeyRef:
                name: ambulance-db-secret
                key: username

          - name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: ambulance-db-secret
                key: password

          - name: POSTGRES_DB
            value: ambulance

          - name: POSTGRES_SSLMODE
            value: disable

        resources:
          requests:
            memory: "64Mi"
            cpu: "0.01"
          limits:
            memory: "512Mi"
            cpu: "0.3"

      - name: openapi-ui
        image: swaggerapi/swagger-ui
        imagePullPolicy: Always
        ports:
        - name: api-ui
          containerPort: 8081

        env:
          - name: PORT
            value: "8081"

          - name: URL
            value: /openapi

          - name: BASE_URL
            value: /openapi-ui

          - name: FILTER
            value: "true"

          - name: DISPLAY_OPERATION_ID
            value: "true"

        resources:
          requests:
            memory: "16M"
            cpu: "0.01"
          limits:
            memory: "64M"
            cpu: "0.1"