apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- deployment.yaml
- service.yaml

configMapGenerator:
  - name: ml-ambulance-webapi-postgres-init
    files:
      - params/init-db.sql
  - name: ml-ambulance-webapi-config
    literals:
      - database=ml-ambulance
      - collection=ambulance
patches:
- path: patches/webapi.deployment.yaml
  target:
    group: apps
    version: v1
    kind: Deployment
    name: ml-ambulance-webapi